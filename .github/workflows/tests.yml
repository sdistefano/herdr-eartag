name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-latest, python: "3.9"}
          - {os: macos-latest, python: "3.12"}
          # Python 3.9 (the minimum) is no longer built for the newest Ubuntu image.
          - {os: ubuntu-22.04, python: "3.9"}
          - {os: ubuntu-latest, python: "3.12"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git for the diff-stat test
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "ci"
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v
